{% extends "base.html" %}
{% load static %}
{% block title %}Check Your Email | HostelHub{% endblock %}
{% block content %}
<div class="auth-page auth-page-compact">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo-badge"><img src="{% static 'images/logo_badge.png' %}" alt="HostelHub Logo" class="brand-logo-img"></div>
            <h1>Check your email</h1>
            <p>If an account exists for that address, reset instructions have been sent.</p>
        </div>
        <a class="btn btn-primary btn-full" href="{% url 'accounts:login' %}">Back to login</a>
    </div>
</div>
{% endblock %}
