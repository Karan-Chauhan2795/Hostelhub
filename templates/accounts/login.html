{% extends "base.html" %}
{% load static %}
{% block title %}Login | HostelHub{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <h1>HostelHub</h1>
            <p>Secure hostel management access</p>
        </div>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="field">
                <label for="id_identifier">Username or Email</label>
                {{ form.identifier }}
            </div>
            <div class="field">
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>
            <div class="field-inline">
                {{ form.remember_me }}
                <label for="id_remember_me">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <div class="auth-links">
            <a href="{% url 'accounts:forgot_password' %}">Forgot password?</a>
        </div>
    </div>
</div>
{% endblock %}
