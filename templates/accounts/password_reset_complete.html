{% extends "base.html" %}
{% load static %}
{% block title %}Password Updated | HostelHub{% endblock %}
{% block content %}
<div class="auth-page auth-page-compact">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo-badge"><img src="{% static 'images/logo_badge.png' %}" alt="HostelHub Logo" class="brand-logo-img"></div>
            <p class="eyebrow">HOSTELHUB</p>
            <h1>Password updated</h1>
            <p>Your password has been changed successfully. You can now log in with your new password.</p>
        </div>
        <a class="btn btn-primary btn-full" href="{% url 'accounts:login' %}">Login</a>
    </div>
</div>
{% endblock %}
