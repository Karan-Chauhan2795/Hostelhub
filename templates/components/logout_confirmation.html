<div class="logout-modal" data-logout-modal hidden>
  <div class="logout-modal-card" role="dialog" aria-modal="true" aria-labelledby="logout-modal-title" aria-describedby="logout-modal-description" tabindex="-1">
    <div class="logout-modal-icon" aria-hidden="true"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h2 id="logout-modal-title">Logout from HostelHub?</h2>
    <p id="logout-modal-description">Are you sure you want to log out of your account?</p>
    <form class="logout-modal-actions" method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="btn btn-secondary" type="button" data-logout-cancel>Cancel</button>
      <button class="btn logout-confirm-button" type="submit"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</button>
    </form>
  </div>
</div>
