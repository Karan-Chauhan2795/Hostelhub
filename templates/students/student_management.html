{% extends "base.html" %}
{% block title %}Student Management | HostelHub{% endblock %}
{% block content %}
<section class="card">
    <div class="section-header">
        <div>
            <p class="eyebrow">Directory</p>
            <h2>Student Management</h2>
        </div>
        <input type="search" class="search-box" data-table-search="students-table" placeholder="Search students">
    </div>
    <table class="data-table" id="students-table">
        <thead><tr><th>Name</th><th>Roll No.</th><th>Course</th><th>Room</th></tr></thead>
        <tbody>
            {% for student in students %}
            <tr><td>{{ student.name }}</td><td>{{ student.roll }}</td><td>{{ student.course }}</td><td>{{ student.room }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
