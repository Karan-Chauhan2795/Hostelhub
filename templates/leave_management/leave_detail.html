{% extends "base.html" %}
{% block title %}Leave Request | HostelHub{% endblock %}
{% block content %}<section class="page-card"><p class="eyebrow">Leave request</p><h1>{{ object.get_status_display }}</h1><dl class="detail-list"><div><dt>From</dt><dd>{{ object.start_date|date:"d M Y" }}</dd></div><div><dt>To</dt><dd>{{ object.end_date|date:"d M Y" }}</dd></div><div><dt>Reason</dt><dd>{{ object.reason }}</dd></div></dl></section>{% endblock %}
